# corepp conda environment — pip pins for scientific/UI deps; PyTorch stack via conda (CUDA 12.1).
#
# PointNet++: Pointnet_Pointnet2_pytorch/ — no project-local CUDA extension build (no nvcc).
# pytorch3d accelerates FPS / ball query / FP kNN (falls back to pure PyTorch if import fails).
#
# PyTorch + CUDA 12.1 (official): https://pytorch.org/get-started/locally/
#   Select: Conda, Linux, Python 3.10, CUDA 12.1 → shows:
#   conda install pytorch torchvision pytorch-cuda=12.1 -c pytorch -c nvidia
# PyTorch3D (conda): https://github.com/facebookresearch/pytorch3d/blob/main/INSTALL.md
#   conda install pytorch3d -c pytorch3d
#
# Channel order: pytorch + nvidia supply GPU builds; pytorch3d supplies pytorch3d; conda-forge/defaults for the rest.
#
# Create: conda env create -f environment.yml
# Update: conda env update -f environment.yml --prune
#
# Verify:
#   python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
#   python -c "import pytorch3d; print(pytorch3d.__version__)"
#
name: corepp
channels:
  - pytorch
  - nvidia
  - pytorch3d
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # GPU stack — same CUDA generation (12.1) via pytorch-cuda meta-package from nvidia channel
  - pytorch==2.1.0
  - torchvision==0.16.0
  - pytorch-cuda=12.1
  - pytorch3d=0.7.7
  - pip:
    # setuptools>=81 can drop pkg_resources; pin for compatibility with PyTorch 2.1 tooling.
    - setuptools>=69,<81
    - iopath
    - open3d==0.17.0
    - scikit-image==0.22.0
    - plyfile==1.0.2
    - Pillow==9.5.0
    - trimesh==4.0.5
    - diskcache==5.6.3
    - tensorboard==2.15.1
    - numba==0.58.1
    - opencv-python==4.8.1.78
    # Used by corepp scripts (train/test/metrics/data_prep, etc.) and Pointnet_Pointnet2_pytorch visualizer
    - matplotlib==3.8.2
    - pandas==2.1.4
    - scikit-learn==1.3.2
    - scipy==1.11.4
    - tqdm==4.66.1
