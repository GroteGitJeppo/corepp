# corepp conda environment — INSTALL.md pip pins plus extra imports used across corepp/
# (matplotlib, pandas, tqdm, scikit-learn, scipy).
#
# PointNet++: sibling tree Pointnet_Pointnet2_pytorch/ — no project-local CUDA extension build (no nvcc).
# Optional pytorch3d (pip wheel) accelerates FPS / ball query / FP kNN; falls back to pure PyTorch if absent.
#
# PyTorch cu121 wheels bundle the CUDA runtime for GPU; no conda nvcc or CUDA toolkit required.
# PyTorch install matrix: https://pytorch.org/get-started/locally/ (CUDA 12.1)
#
# Create: conda env create -f environment.yml
# Update: conda env update -f environment.yml --prune
#
# Verify:
#   python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
#   # expect 2.1.0, 12.1, True on a machine with a CUDA GPU and driver
#
name: corepp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # Equivalent to: pip install torch==... torchvision==... -f https://download.pytorch.org/whl/cu121/torch_stable.html
    - --extra-index-url https://download.pytorch.org/whl/cu121
    # setuptools>=81 can drop pkg_resources; pin for compatibility with PyTorch 2.1 tooling.
    - setuptools>=69,<81
    - torch==2.1.0
    - torchvision==0.16.0
    - open3d==0.17.0
    - scikit-image==0.22.0
    - plyfile==1.0.2
    - Pillow==9.5.0
    - trimesh==4.0.5
    - diskcache==5.6.3
    - tensorboard==2.15.1
    - numba==0.58.1
    - opencv-python==4.8.1.78
    # Used by corepp scripts (train/test/metrics/data_prep, etc.) and Pointnet_Pointnet2_pytorch visualizer
    - matplotlib==3.8.2
    - pandas==2.1.4
    - scikit-learn==1.3.2
    - scipy==1.11.4
    - tqdm==4.66.1
    # PyTorch3D: iopath is a runtime dependency. Wheel matches py310 + torch 2.1 + cu118; works with cu121 PyTorch wheels.
    - iopath
    - "pytorch3d==0.7.7 --no-index --no-cache-dir -f https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu118_pyt210/download.html"
