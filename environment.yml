# corepp conda environment — INSTALL.md pip pins plus extra imports used across corepp/
# (matplotlib, pandas, tqdm, scikit-learn, scipy) and Pointnet2.PyTorch/tools (tensorboard_logger).
# Also: pinned CUDA 12.1.x toolkit (nvcc/headers) and GCC 12.3.x for building CUDA extensions (e.g. PointNet2).
#
# PyTorch cu121 wheels bundle the CUDA *runtime* they load at import time; conda cuda-toolkit
# supplies nvcc/headers for compiling extensions. Keep cuda-toolkit on 12.1.* only.
#
# PyTorch install matrix: https://pytorch.org/get-started/locally/ (CUDA 12.1)
#
# Create: conda env create -f environment.yml
# Update: conda env update -f environment.yml --prune
#
# Before building extensions (PointNet2 setup.py):
#   export CUDA_HOME="$CONDA_PREFIX"
#   export PATH="$CONDA_PREFIX/bin:$PATH"
# Optional: export TORCH_CUDA_ARCH_LIST="8.6"   # e.g. NVIDIA A40 (Ampere)
#
# Verify:
#   python -c "import torch; print(torch.__version__, torch.version.cuda)"   # 2.1.0, 12.1
#   nvcc --version                                                           # 12.1.x
#   x86_64-conda-linux-gnu-gcc --version                                   # 12.3.x
#
name: corepp
channels:
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - nvidia::cuda-toolkit=12.1.*
  # Host compilers for nvcc (CUDA 12.1 supports GCC through 12.x on Linux; keep gcc/gxx matched).
  - conda-forge::gcc_linux-64=12.3.*
  - conda-forge::gxx_linux-64=12.3.*
  - pip:
    # Equivalent to: pip install torch==... torchvision==... -f https://download.pytorch.org/whl/cu121/torch_stable.html
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.1.0
    - torchvision==0.16.0
    - open3d==0.17.0
    - scikit-image==0.22.0
    - plyfile==1.0.2
    - Pillow==9.5.0
    - trimesh==4.0.5
    - diskcache==5.6.3
    - tensorboard==2.15.1
    - numba==0.58.1
    - opencv-python==4.8.1.78
    # Used by corepp scripts (train/test/metrics/data_prep, etc.)
    - matplotlib==3.8.2
    - pandas==2.1.4
    - scikit-learn==1.3.2
    - scipy==1.11.4
    - tqdm==4.66.1
    # Pointnet2.PyTorch/tools/train_and_eval.py
    - tensorboard_logger==0.1.0
